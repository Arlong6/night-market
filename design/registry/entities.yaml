# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: product_matches
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      # Future dependents (add when designed):
      # - design/gdd/scoring.md          # #15 — aggregates per-slot results into stars
      # - design/gdd/station-interactions.md  # #5 — may show live "right/wrong" feedback
      # - design/gdd/carry-deliver.md    # #4 — delivery-point adjudication
    variables:
      - catalog         # r3: data source, NOT logic source
      - instance.network_index
      - instance.is_spoiled
      - demand.kind
      - demand.family
      - demand.network_index
    output_range: [0, 4]
    expression: "ProductMatching.Matches(catalog, instance, demand) -> MatchResult enum {Unevaluated=0, Match=1, WrongFamily=2, WrongSku=3, Spoiled=4}; both the instance side AND the demand side are validated before either branch runs; is_spoiled short-circuits AFTER domain validation, BEFORE adjudication"
    notes: "Returns an enum, not a bool (revised r1 2026-09-20). Only Match satisfies a slot; the other three values exist so #13/#15 can give differentiated feedback — WrongFamily means go to another machine, WrongSku means grab another item from the same pot. Rationale is precedent consistency: the slot-allocation rule lives in this table to stop #15 reinventing it, and failure classification is the identical situation. Still deliberately exact — no partial credit, no fuzzy matching."
    added: 2026-09-19
    revised: 2026-09-21  # r3: moved OUT of IProductCatalog into `static ProductMatching`; takes catalog as a parameter
    # r3 HOUSING CHANGE (design/gdd/product-database.md, Interactions): Matches() and AllocateSlot()
    # are NO LONGER members of IProductCatalog. Reason (qa-lead over systems-designer, adjudicated by
    # creative-director): while they sat on the interface, a test double `FakeProductCatalog :
    # IProductCatalog` had to REIMPLEMENT the adjudication logic -- so AC11a's regression vectors,
    # AC5, AC6 and AC13 would all run against the fake's rules and the real implementation could be
    # wholly wrong while every test stayed green. `catalog` is now a DATA-SOURCE parameter, not a
    # LOGIC-SOURCE: fakes supply rows, the adjudication is always this one function.
    # "False green" is the single most consistent failure mode across all three review rounds.
    # Verified in prototypes/product-database-core/ (FAKE-r3 vs the FAKE-R2SHAPE counterfactual).  # r2 review: Unevaluated=0 sentinel (Match=0 made the zero value the PASS value, violating rule 1b); demand-side input domain now validated (family==Invalid, nameable==false, deprecated all threw silently before)
  - name: allocate_slot
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      # Future dependents (add when designed):
      # - design/gdd/scoring.md          # #15 — delivery-point integration
      # - design/gdd/carry-deliver.md    # #4 — owns `filled`, and owns CROSS-ORDER allocation
    variables:
      - catalog         # r3: data source, NOT logic source -- see product_matches notes
      - slots           # was order.slots; the function takes the slot array directly
      - filled          # caller-supplied occupancy; #15/#4 own this state
      - instance.network_index
      - instance.is_spoiled
    output_range: [-1, "slots.Length - 1"]
    precondition: "filled.Length == slots.Length, else throw ArgumentException (AC13 case 7)"
    expression: "PRECONDITION filled.Length == slots.Length. ELIGIBILITY a slot s is a candidate iff Matches(catalog, instance, s) == Match. PRIORITY among candidates, Named before Family. TIE-BREAK lowest index not yet filled. One product consumes one slot. No candidate -> -1"
    notes: "Registered in r2. The r1 signature AllocateSlot(order, instance) could not evaluate its own rule -- the rule says 'lowest index NOT YET FILLED' but CustomerOrder carries no occupancy and the GDD assigns that state to #15/#4, so the three-slot worked example was unreachable from the API and AC13 was untestable. `filled` is now a caller-supplied parameter: the function stays pure and the layering is unchanged. SCOPE: single order only. Cross-order allocation (the same item accepted by two different customers' orders) is #4's, adjudicated at the delivery point; the scarce-locks-first exchange argument gives zero protection there because the scarce and flexible slots sit in different orders."
    added: 2026-09-20
    revised: 2026-09-21  # r3: eligibility predicate added; signature takes catalog; filled-length precondition
    # was (r2): "Named before Family; within one priority, lowest unfilled slot index; one product
    #           consumes one slot; no eligible slot -> -1"  -- it never DEFINED eligibility.
    # r3 PROTOTYPE EVIDENCE (prototypes/product-database-core/, probe AC13-4-R2RULE):
    #   order [Family:Oden, Named:coffee], deliver one fresh 黑輪. Under the r2 wording the
    #   literal rule (Named first, lowest index, not yet filled) assigns it to SLOT 1 -- the
    #   named-coffee slot. Correct answer is slot 0. The rule contradicted its own acceptance
    #   criterion AC13 case 5. The eligibility predicate is LOAD-BEARING, not restatement.
  - name: unresolved_count
    status: active
    source: design/gdd/game-session-state.md
    referenced_by:
      - design/gdd/game-session-state.md
      # Future dependents (add when designed):
      # - design/gdd/symbol-binding.md       # #9 — UI displays this counter
      # - design/gdd/notebook-ui.md          # #16 — renders the counter widget
    variables:
      - slots_in_vignette
      - binding_map
      - correct_table
    output_range: [0, 5]
    expression: "|slots_in(v)| - |slots_in(v) ∩ correctly_bound_slots|"
    notes: "The 'N/M 待解' counter. 0 = vignette complete; max = total slots in that vignette (typically 3–5). Counter does NOT distinguish unguessed from wrong-guessed (per GDD Mechanic #2 spec)."
    added: 2026-05-29
    revised: ""

  - name: vignette_valid
    status: active
    source: design/gdd/game-session-state.md
    referenced_by:
      - design/gdd/game-session-state.md
      # Future dependents (add when designed):
      # - design/gdd/cascade-shimmer.md      # #10 — triggered by transition true
      # - design/gdd/vignette-state-machine.md  # #8 — drives vignette lifecycle
    variables:
      - slots_in_vignette
      - binding_map
      - correct_table
    output_range: [false, true]
    expression: "∀ slot ∈ slots_in(v) : binding_map[slot] == correct_table[slot]"
    notes: "Predicate; true triggers cascade. Both 'every slot bound' AND 'every binding matches correct_table' required."
    added: 2026-05-29
    revised: ""

  - name: player_frame_budget
    status: active
    source: design/gdd/first-person-controller.md
    referenced_by:
      - design/gdd/first-person-controller.md
      # Future dependents (add when the consuming doc NAMES this formula):
      # - design/gdd/netcode-session.md   # AC4 / AC23 already CONSUME this bound, but under the
      #                                   # prose name「角色移動速度上限」, not this formula name.
      #                                   # See the stale `blocked-by` note recorded 2026-09-24.
      # - design/gdd/carry-deliver.md     # #4 — consumes the POSITIONS this budget produces
      # - design/gdd/station-interactions.md  # #5 — same
    variables:
      - player_move_speed_max    # 1.39 m/s
      - dt                       # this frame's time step, seconds
      - movement_max_step_sec    # 0.10 s — clamp, derived from network_tick_rate, not a knob
    output_range: [0, 0.139]
    expression: "player_move_speed_max × min(dt, movement_max_step_sec) -> metres of TOTAL displacement permitted this frame, covering input displacement PLUS depenetration displacement, in any direction and any input combination"
    notes: "C12 — the FP controller's hard delivery upward. Registered because #4 and #5 consume the
      POSITIONS this budget produces, and because the same sentence had two readings 6× apart.
      ⚠ THE 0.139 IS A WORST-CASE CEILING, NOT A PER-FRAME ALLOWANCE. Reading it as a constant
      0.139 m/frame permits 8.4 m/s at 60fps — contradicting the speed cap outright, and making
      netcode AC23 false. The ceiling is only reached when dt is clamped at movement_max_step_sec.
      Load-bearing consequences: (1) diagonal input MUST be normalised (strafe-running is the
      classic FPS bug, and the upstream AC uses exactly that as its test); (2) depenetration
      displacement draws on the SAME budget, which is what makes a 0.6 m overlap take 0.43 s to
      separate at 60fps rather than 0.083 s — read as a shove, not a bounce; (3) zero teleports
      for player characters during a shift. On overflow, the INPUT component is sacrificed —
      never proportionally scaled, or holding forward discounts the depenetration."
    added: 2026-09-24
    revised: ""

  - name: depenetration_delta
    status: active
    source: design/gdd/first-person-controller.md
    referenced_by:
      - design/gdd/first-person-controller.md
      # Future dependents (add when designed):
      # - design/gdd/npc-customer-flow.md   # #7 — queries capsules this displaces
    variables:
      - overlap_depth              # metres of capsule interpenetration against the LOCALLY RENDERED other capsule
      - self_depenetration_scale   # 0.5 — vs another player
      - npc_depenetration_scale    # 1.0 — vs a customer
    output_range: [0, 0.6]
    expression: "scale × overlap_depth, applied ENTIRELY to self; scale = self_depenetration_scale (0.5) when the other end is a player, npc_depenetration_scale (1.0) when it is an NPC. Runs BEFORE displacement summation, and draws on player_frame_budget"
    notes: "C9 / C11 / F4. `scale = 1 / n_correcting_ends`: two players each push THEMSELVES out
      (n=2 -> 0.5), while a player pushes itself out of a customer and writes zero to the customer
      (n=1 -> 1.0). Registered specifically because the two scales diverge and the divergence is
      one line old (2026-09-23): sharing 0.5 makes CUSTOMERS STICKIER THAN TEAMMATES, the exact
      inverse of C11's intent — shoving a customer aside should be FASTER than negotiating past a
      teammate, and that asymmetry is where the comedy lives.
      ⚠ 'Applied entirely to self' is the only form compatible with owner authority — 'push the
      other player x cm' is PHYSICALLY IMPOSSIBLE there (no write permission on their transform).
      The push is instead carried by network lag itself: A stops against B's ghost while B keeps
      walking in reality, so B's ghost keeps pressing for the next L seconds. Symmetric by
      construction; needs no messages, and needs no global solver at any n (unlike a 50/50 split,
      which would in three-body).
      ⚠ Upper bound 0.6 = 2·r_c (max meaningful overlap depth); the frame budget clamps it lower."
    added: 2026-09-24
    revised: ""

  - name: should_warn
    status: active
    source: design/gdd/first-person-controller.md
    referenced_by:
      - design/gdd/first-person-controller.md
      # Future dependents (add when designed):
      # - design/gdd/hud.md   # #11 — renders whatever this predicate gates
    variables:
      - closing_speed        # m/s, clamped to player_move_speed_max before evaluation
      - time_to_contact      # seconds until centre distance reaches 2·r_c
      - warning_lead_sec     # 0.5 s (provisional)
    output_range: [false, true]
    expression: "(closing_speed > 0) AND (time_to_contact ≤ warning_lead_sec)"
    notes: "F7 — the delivery for crowding criterion 5. Same shape as vignette_valid: a predicate,
      not a scalar. Registered because the FORM was what changed this round.
      ⚠ The rejected form was a warning RADIUS = v × t × 2, which had two defects: it omits the
      +2·r_c term (contact happens at centre distance 2·r_c, not 0), and at this game's scale a
      pure radius DEGENERATES INTO ALWAYS-ON (lead 1.0 s -> 3.4 m against a ~10 m shop diagonal).
      ⚠ closing_speed must be clamped to player_move_speed_max BEFORE evaluation, or a post-HOL
      burst lights the whole screen up.
      Executable as 5 pure-C# EditMode tests — no PhysX, no NGO."
    added: 2026-09-24
    revised: ""

