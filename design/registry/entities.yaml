      PLUS depenetration displacement, for any direction and any input combination. Three corollaries,
      each of which is a network-independent trap that would make AC23 false: (1) diagonal input MUST
      be normalised -- strafe-running is the single most common FPS implementation bug and the upstream
      AC uses exactly this as its criterion; (2) depenetration eats the same budget, which incidentally
