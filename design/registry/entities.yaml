    value: "asia-northeast1"
    unit: relay_region_id_last_resort_default
    notes: "Unity Relay allocation 的 region —— **最後退路的預設值，不是寫死值**。🔴 本值直接決定 AC22 成敗，且沒有自動解：W1 第 4 批實測（20 樣本、Relay WSS、雙進程同置台灣，故 RTT = 4 × d(台灣,region)）—— asia-northeast1 p95 = 94.5ms（單程 22.2）／預設 region p95 = 335.8ms（單程 82.8，已超過 interact_rtt_p95_ms 的 300ms）／europe-west4 p95 = 437.8ms（單程 108.6）。三點吻合線性模型。之所以不能留空靠引擎自選：Relay 的 QoS（自動挑最近 region）在 Web 上拋 PlatformNotSupportedException（QoS SDK does not support WebGL），而本作 Web-only。⚠ **本值不得被當成寫死的全域 region 使用**（arlong 2026-09-15 裁決「讓國外的人也可以參與」）：依 Core Rule #28，region 須貼著 Host 選，先查 relay_region_by_timezone、再退 relay_region_offset_fallback，兩者皆未命中時才用本值。之所以取東亞值當最後退路，僅因首批玩家預期集中於此，與「該選哪區」的規則無關。可用值（2026-09-15 實機列舉）：asia-southeast1 / asia-northeast1 / asia-south1 / us-central1 / us-east1 / us-west1 / europe-north1 / europe-west4 / europe-central2 / australia-southeast1 / southamerica-east1 —— 無台灣／香港節點，東亞最近為東京。⚠ region 由 Host 在建立 allocation（＝#26「開始上班」呼叫 StartRelayNetworkAsync）時決定，**一個班次內不可改**；依 #23a 局間會 StopNetworkAsync 拆掉，故理論上每班次可重選 —— 此為由 API 形狀推得的推論，尚未實測。約束⑮、Core Rule #28、AC22b。"
    added: 2026-09-15
    revised: ""

