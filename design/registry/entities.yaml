    revised: ""

  - name: relay_client_connection_ttl_sec
    status: active
    source: design/gdd/netcode-session.md
    referenced_by:
      - design/gdd/netcode-session.md
    value: 10
    unit: seconds
    notes: "**引擎/服務事實，非可調旋鈕**。Relay 對每個 client 連線的存活時限；host 在 BIND 後尚無 peer 連入時為 60s。任何經過該 client 的訊息都會重置。NGO 自動送 PING 維持（間隔＝UnityTransport.HeartbeatTimeoutMS＝500ms）。⚠ 官方文件未記載任何設定方式，**不得寫成可調**。⚠ 瀏覽器節流背景分頁 timer 會使 PING 停送 → 背景 10s 即被踢，這是 Core Rule #23（Lobby 延後建連）從優化升格為必需的直接原因，見 #23c。W1 第 0 批查證（Relay 官方文件）新增。"
    added: 2026-09-13
    revised: ""

  - name: lobby_host_silence_timeout_sec
    status: active
    source: design/gdd/netcode-session.md
    referenced_by:
      - design/gdd/netcode-session.md
      # Future dependents: 大廳 UI GDD, /ux-design lobby screen
    value: 30
    unit: seconds
    notes: "Lobby 自最後一次收到任何 session 事件起計時，逾時即顯示店語提示＋可離開按鈕（Core Rule #25）。**不等服務端**。存在的理由：W1 第 1 批實測發現 Host 被強制終止（kill -9）時，服務端要 **132.61 秒**才廣播 PlayerLeaving；而 Host 優雅離開只要 **1.14 秒**。本常數是針對那條罕見慢路徑的本地自救。Tuning 15-45，**上限受支柱 5 的『純看戲 >30 秒就重做』約束，不宜超過**。arlong 於 2026-09-13 裁決。"
    added: 2026-09-13
    revised: ""

