  - name: input_cancel_threshold
    status: active
    source: design/gdd/first-person-controller.md
    referenced_by:
      - design/gdd/first-person-controller.md
    value: 0.5
    unit: dimensionless
    notes: "PROVISIONAL (2026-09-26, needs playtest). Safe range 0.3-0.8. The decidable predicate behind
      rule C10's 'input is being continuously cancelled': IsInputCanceled := overlapping AND |raw_input| >
      dead_zone AND |applied_input_displacement| < |desired_input_displacement| * (1 - threshold). Meaning:
      'more than half of what you asked for was eaten'. WHY IT EXISTS: the GDD's C10 only REJECTED the
      wrong definition ('net displacement is zero' -- which would turn every idle player into a ghost) and
      never supplied the right one; the first T0 test run found the implementation had to invent it, which
      makes code the owner of a design value. Timer semantics that ride on it: full separation -> reset;
      predicate true -> += dt; still overlapping but predicate false -> HOLD (neither increment nor reset)
      -- the hold case protects players whose finger is not steady on W, otherwise a genuinely pinned player
      might never reach the fuse. TOO HIGH: a player pushing at an angle never trips the fuse. TOO LOW:
      brushing past someone accumulates timer and PassThrough becomes routine."
    added: 2026-09-26
    revised: ""

  - name: npc_id_reuse_cooldown_sec
    status: active
    source: docs/architecture/adr-0003-solid-capsule-query.md
    referenced_by:
      - docs/architecture/adr-0003-solid-capsule-query.md
      - design/gdd/systems-index.md   # 前向義務表 #7
    value: 1.0
    unit: seconds
    notes: "PROVISIONAL (2026-09-28, arlong). OWNED BY #7 (customer system); registered here so the
      obligation is visible before #7's GDD exists. The minimum time the Host must wait before reusing a
      despawned NPC's id. WHY: players' PassThroughNpcMask (ADR-0003) is bit-indexed by NPC id; when an
      NPC despawns the owning player's PairMachine destroys the pair and clears the bit, but that clear
      takes <= 1 tick + one-way transport to reach other ends. Player SLOT reuse is protected by the
      locker-room transition's 3.0 s hard floor (netcode-session.md:177); NPC ids have NO equivalent
      structural delay -- customers can leave and be replaced within seconds -- so without a cooldown a
      brand-new customer inherits the previous occupant's PassThrough bit on any end that read the stale
      mask. 1.0 s is >> the worst-case clear window (~0.4 s cross-continent) and shorter than a customer's
      door-entry animation. LOWER BOUND: must exceed 1 tick + one-way p95. UPPER BOUND: only limits how
      fast ids cycle under >64 concurrent customers per shift (MVP is far below that)."
    added: 2026-09-28
    revised: ""

