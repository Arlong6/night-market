# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: total_semantic_slots
    status: active
    source: design/gdd/game-session-state.md
    referenced_by:
      - design/gdd/game-session-state.md
      - design/gdd/lexicon-village-elder-question.md  # keystone artifact §3 enumerates 25 slots
      - design/gdd/input-system.md                # #2 — keyboard a11y rule requires arrow-nav over 25-icon palette
      # Future dependents (add when designed):
      # - design/gdd/symbol-binding.md          # #9 — binding_map size
      # - design/gdd/procedural-language-generator.md  # #12 — produces 25 phonetic forms
      # - design/gdd/notebook-ui.md             # #16 — palette holds 25 meaning icons
    value: 25
    unit: semantic_slots
    notes: "Sum of 21 content words (across 7 vignettes) + 4 grammar particles. Within systems-designer's 17–20 unique glyph cap; total slots ≠ unique glyphs (some slots share phonemes in their encoding)."
    added: 2026-05-29
    revised: ""

  - name: vignette_count
    status: active
    source: design/gdd/game-session-state.md
    referenced_by:
      - design/gdd/game-session-state.md
      - design/gdd/lexicon-village-elder-question.md  # 7 NPC vignette tableaux
      # Future dependents:
      # - design/gdd/vignette-content-authoring.md  # #13
      # - design/gdd/vignette-state-machine.md      # #8
      # - design/gdd/cascade-shimmer.md             # #10
      # - design/gdd/elder-climax-flow.md           # #15 — requires all 7 cascaded
    value: 7
    unit: vignettes
    notes: "Baker, Blacksmith, Fisher, Weaver, Child, Traveler, Storyteller. MVP ships only Baker; full count by Vertical Slice."
    added: 2026-05-29
    revised: ""

  - name: slots_per_vignette_range
    status: active
    source: design/gdd/game-session-state.md
    referenced_by:
      - design/gdd/game-session-state.md
      - design/gdd/lexicon-village-elder-question.md
