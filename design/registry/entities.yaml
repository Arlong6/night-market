    notes: "Lobby 階段『Host 可離開分頁的最長秒數』＝ 實測服務端／transport 逾時 × 本值（#23b、AC34b）。r4 二次修訂登錄：是設計旋鈕不是導出值，由 #23b 於 r4 引入卻未登錄。Tuning 0.3-0.8。依賴 [P-10] 回填實測 TTL 後才有絕對值。"
    added: 2026-09-13
    revised: ""

  # ── W1 第 0 批原始碼查證後新增／回填（2026-09-13）──
  - name: ownership_change_cooldown_ticks
    status: active
    source: design/gdd/netcode-session.md
    referenced_by:
      - design/gdd/netcode-session.md
      # Future dependents: 攜帶與交付 GDD (交接冷卻), 機台互動組 GDD
    value: 6
    unit: network_ticks
    notes: "同一 NetworkObject 兩次 ownership 變更之間的最小間隔。**引擎硬下限**：NGO 2.13.2 原始碼 k_MaximumTickOwnershipChangeMultiplier = 6，低於此值會 LogWarningServer「[Rapid Ownership Change Detected][Potential Loss in State]」且 owner-write 的 NetworkVariable 更新可能遺失。道具快速互相拋接的玩法必須受此限制。W1 第 0 批查證（NGO 原始碼）新增。"
