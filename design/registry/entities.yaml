    value: "T_load=25, T_lobby=10, T_spawn=10"
    unit: seconds
    notes: "進房三分段的**各自獨立硬閘門**（AC7a 明令「不得以總和抵銷」）。r4 新增為獨立常數——先前只存在於公式②與 join_time_budget_sec 的 notes 字串裡，等於未登錄。合計 45s 對 join_time_budget_sec(60) 留 25% 餘裕。T_load 的餘裕實際為 0（50MB ÷ 20Mbps = 20s + TTFB 5s），故公式⑤的體積槓桿不得少列（含 WebAssembly 2023 開關）。"
