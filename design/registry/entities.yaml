      is worth keeping: this is a feedback loop of gain exactly 1 and delay exactly L (my yield rate
      ceiling equals his approach rate), so the boundary is only marginally stable -- BUT that analysis
      covers ONE-WAY approach only and does NOT cover C9's two-way mutual depenetration (see OQ-F6,
      still unmeasured; network-programmer's delay-differential analysis suggests one-off overshoot
      bounded by v*L ~ 0.50 m rather than sustained resonance, and C10's fuse bounds it structurally)."
