# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: machine_family_values
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      - design/registry/sku-shipped-snapshot.txt  # frozen_enum: block — AC15a compares against it
      # Future dependents (add when designed):
      # - design/gdd/station-interactions.md  # #5 — each station queries its own menu
      # - design/gdd/customer-system.md       # #7 — family-level demands
      # - design/gdd/wave-director.md         # #8 — per-station load weighting
      # - design/gdd/hud.md                   # #11 — family demand icon lookup key
    value:
      - Invalid = 0
      - Shelf = 1
      - Oden = 2
      - Microwave = 3
      - CoffeeMachine = 4
    unit: enum_values_explicit
    notes: "Product source families. Integer values MUST be explicit and may only be appended — never reordered, never renumbered: Unity serializes enum fields as the underlying integer, so reordering the declaration silently remaps every existing asset (Oden could become Microwave) with no compile error and no exception. Invalid=0 is a sentinel and must never be assigned. Guarded by AC15a (declaration-level snapshot, bidirectional, also freezes the underlying type) and AC15b (asset-level integer check). R3 FIX: this note still said 'AC15', which r2 had already split into a/b -- and this was the ONE tuning entry that also omitted the back-reference to design/registry/sku-shipped-snapshot.txt, i.e. the enum that r1's creative-director ranked highest on severity-over-cost was the one whose registry entry pointed at the weakest guard. R3 also notes the underlying type is frozen as `byte`. NOT isomorphic to the art bible §3.3 demand icon set (碗/杯/條碼/箱) — those were drawn for service types, not for machine_family; only 碗 and 杯 overlap, and Microwave/Shelf have no icon. See OQ-P1. The 4-vs-5 gap against the concept doc's 'five stations' is resolved in Core Rules 3b: checkout is a delivery/verification action, not a product source."
    added: 2026-09-19
    revised: 2026-09-20  # r3 review: AC15 -> AC15a/b, snapshot back-reference, underlying type frozen

  - name: sku_status_values
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      - design/registry/sku-shipped-snapshot.txt
    value:
      - Invalid = 0
      - Active = 1
      - Deprecated = 2
    unit: enum_values_explicit
    notes: "Added in r2. The status field was MISSING from the GDD's rule-1 field table entirely, while rule 2, the States table, both filtered queries, AC3/AC4/AC16 and three Edge Cases all depended on it. Append-only, never reordered. Invalid=0 is a sentinel and must never be assigned. Deprecated is terminal -- AC1a asserts no row goes back to Active."
    added: 2026-09-20
    revised: ""

  - name: demand_kind_values
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      # Future dependents: customer-system.md (#7) constructs these
      - design/registry/sku-shipped-snapshot.txt
    value:
      - Invalid = 0
      - Family = 1
      - Named = 2
    unit: enum_values_explicit
    notes: "Added in r2. Rule 1b mandates explicit integers for EVERY enum, and this one -- declared 190 lines later in the same GDD -- complied with neither half. Without the sentinel, a default-initialised CustomerDemand is {kind=Family, family=Invalid, network_index=0}, a SYNTACTICALLY VALID family demand that returns WrongFamily against every product in the game, forever, with no error. Guarded by AC6c, and made unrepresentable by the CustomerDemand.Family()/.Named() factories."
    added: 2026-09-20
    revised: ""

  - name: match_result_values
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      - design/registry/sku-shipped-snapshot.txt
      # Future dependents: scoring.md (#15), settlement-screen.md (#13)
    value:
      - Unevaluated = 0
      - Match = 1
      - WrongFamily = 2
      - WrongSku = 3
      - Spoiled = 4
    unit: enum_values_explicit
    notes: "Renumbered in r2. r1 shipped Match=0, which made the ZERO VALUE the PASS value -- an unfilled array, an unwritten out-param or a default(MatchResult) in #15's aggregation all read as 'every slot satisfied'. That is the exact failure rule 1b exists to prevent ('no error, no assert, looks completely normal'), applied with maximum force, and rule 1b was not applied to it. Matches() never returns Unevaluated; reading it means #15 has a bug. The integer values were previously recorded ONLY here and never stated in the GDD that owns the type -- now stated in both."
    added: 2026-09-20
    revised: ""

  - name: sku_nameable_max
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      # Future dependents: customer-system.md (#7), hud.md (#11)
    value: 6
    unit: nameable_sku_entries
    notes: "PROVISIONAL. R3: LOWERED 8 -> 6 by art-director, derived from a SHAPE budget rather than an art-hours budget -- pool A (above-customer-head silhouettes) holds at most ~14 distinct shapes, of which 8 are already spoken for (overtime exclamation 1 + completion check 1 + family icons 6), leaving 6 for named icons. That 14 is a PLANNING ceiling, not a measured threshold; art-director flagged medium confidence and it must be re-calibrated against gate 6 once #11 backfills the real on-screen icon size. R3 also DELETED the N*(N+K) manual-dedup cost model that r2 used to justify the 8 -- the doc carried three mutually incompatible cost models for gate 6 and one of them was load-bearing for this number. The real reason for a ceiling is peak readability, not a cost curve. R3 ADDED A LOWER BOUND: MVP requires nameable >= 2 (arlong ruling 2026-09-20). Without a floor, three individually correct and individually cheap revisions compose into an empty named pool for all of MVP -- and AC4 is vacuously true on the empty set, AC20 is vacuously true, AC3 is unaffected, so none of the thirty ACs would go red. Original r2 note follows.  Refill trigger: same as gate 6's test size -- #11's first in-scene measurement. Rationale for having a number at all: r1 made the UNENFORCEABLE half (runtime concurrency of distinct symbols) the knob and left the ENFORCEABLE half (pool size) at TBD alongside it. Pool size is build-checkable, so it now has a value and an AC (AC20); concurrency is levied on #7 instead. Cost curve worth noting: the k-th nameable icon costs O(1) to draw but (k-1)+K manual silhouette comparisons to clear gate 6, where K is the rest of the above-head symbol inventory -- the doc named the CONSTANT term as its brake and left the growing term unowned."
    added: 2026-09-20
    revised: ""

  - name: sku_nameable_min
    status: active
    source: design/gdd/product-database.md
    referenced_by:
      - design/gdd/product-database.md
      # Future dependents: customer-system.md (#7), hud.md (#11), art production schedule
    value: 2
    unit: nameable_sku_entries
    notes: "MVP FLOOR, ruled by arlong 2026-09-20 (r3). One per generator family, so the two-tier demand
      rule can actually be PLAYTESTED in MVP rather than argued about for a fourth review round. Guarded
      by AC20's lower clause. WHY A FLOOR EXISTS AT ALL: r2 levied only a ceiling, and r3's cross-reference
      pass found that three individually correct, individually cheap revisions (extend the Shelf supply
      constraint to all families / mechanise it inside GetNameable() / tighten the named pool) COMPOSE into
      an empty named pool for the whole of MVP -- while AC4 is vacuously true on the empty set, AC20 was
      vacuously true, and AC3 is unaffected. Thirty ACs, none of them red, and the highest-emotion moment
