      # - design/gdd/vignette-content-authoring.md  # #13 — authoring constraint
      # - design/gdd/notebook-ui.md                 # #16 — per-vignette page layout must fit max 5 slots
    value: [3, 5]
    unit: slots_per_vignette
    notes: "Range, not fixed value. ≥1 enforced as authoring constraint (zero-slot vignettes forbidden — see game-session-state.md Edge Cases). ≤7 recommended for notebook page legibility (see #16 when designed)."
    added: 2026-05-29
    revised: ""

