# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: player_input
    status: active
    api: com.unity.inputsystem 1.14–1.15，project-wide actions（InputSystem.actions）；Movement action map 恰為 {Move2D, Look2D}
    not: 舊版 UnityEngine.Input（Input Manager）
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    reason: "AC1③ 要求可反射列舉的動作表，只存在於新版 Input System；6.3 慣用做法（current-best-practices.md:16-17）；#18 重綁有現成 API"
    referenced_by:
      - docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26
    revised: ""

  - purpose: scene_collision
    status: active
    api: CharacterController.Move(delta) 於純 C# 求解器輸出之後；stepOffset = 0、slopeLimit = 0、enableOverlapRecovery = false
    not: Rigidbody（kinematic + SweepTest）；FixedUpdate
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    reason: "場景碰撞在 C12 預算之外、只能縮短 delta；FixedUpdate 的 catch-up 與 C13「不補跑」衝突"
    referenced_by:
      - docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26
    revised: ""

  - purpose: remote_player_pose_sync
    status: active
    api: stock NetworkTransform，AuthorityMode = AuthorityModes.Owner 顯式設定；不繼承、不覆寫 OnUpdate
    not: AnticipatedNetworkTransform；繼承 NetworkTransform；自訂位置 RPC
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    reason: "owner 權威下本機不需預測；client-server 拓撲預設 Server 權威（multiplayer.md:27-32），忘設則非 host 玩家每幀被 observer 路徑蓋掉且無錯誤訊息——故轉接層 OnNetworkSpawn() 加 runtime guard"
    referenced_by:
      - docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26
    revised: ""

