  - contract: session_events
    status: active
    pattern: direct_call   # C# event；名稱＝netcode GDD 契約表（:795-809）的 PascalCase
    producer: netcode-session（NightShift.Session.Core 經轉接層發布）
    consumers:
      - first-person-controller   # 本端的 PlayerJoined/PlayerLeft(slot)——非 Host 端＝該 slot avatar 的 OnNetworkSpawn/OnNetworkDespawn（r2）：PairMachine 清鍵（ADR-0001 r1）；擁有者端清自己 PassThrough 遮罩的第 slot 位（ADR-0003 r1）
