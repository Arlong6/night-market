    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    # r2 前：HiddenChanged 未限制用途
    signal_signature: "bool IsHidden（Desktop 恆 false）；double NowMs（單調；Web performance.now()、Desktop realtimeSinceStartupAsDouble）；bool IsOnline（只作快速否定）；event Action<bool> HiddenChanged（邊緣觸發，Desktop 永不觸發；只供計時與手勢中斷，不得當成離開——離開只認 IUnloadNotifier 的 pagehide）"
    referenced_by:
