  - pattern: unbounded_client_pose_trust
    status: active
    description: "Host 使用任何 client 自報的姿態（位置、朝向）之前，必須先以自己的複製品綁住：|自報 − 複製品| ≤ tol_lag（player_move_speed_max × host_view_lag_p95_sec），否則拒絕為 PoseOutOfBound。yaw 不綁（複製落後超過一圈且作弊價值為零），但位置必綁。"
    why: "Host 對 client 只有內插後、落後 ≥ 200 ms 的複製品（NGO 2.13.2 無不繼承的旁路），不能直接拿它精確驗；但完全相信自報等於讓改封包者隔牆互動。綁住之後作弊包絡有界且可實測，容差只花在反作弊上不花在合法玩家身上。"
    adr: docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    added: 2026-09-27

  - pattern: claimstate_read_from_rpc_response
    status: active
    description: "client 端不得以「收到互動 RPC 回應」推斷本機的 ClaimState NetworkVariable 已同步更新；所有依賴 claim 狀態的顯示只讀 NetworkVariable 回呼。"
    why: "RPC 與 NetworkVariable 共用同一條 per-client FIFO（NetworkMessageManager.cs:75）但入列時機不同（RPC 呼叫當下、NetworkVariable 每 tick 收集），NGO 不保證順序，官方文件明講 NetworkVariable 只是 eventually consistent。"
    adr: docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    added: 2026-09-27

  - pattern: npc_presence_from_rpc_event
    status: active
    description: "任何依 NPC 在場狀態做決策的邏輯（含 PassThrough 遮罩的清零時機、避讓集合的建立）必須讀 NPC 的 NetworkVariable 狀態，不得讀 NpcStateChanged RPC 事件本身。"
    why: "netcode-session.md:823-826 已裁定狀態真相走 NetworkVariable、RPC 只驅動表現層；且 RPC 與 NetworkVariable 送達順序無保證（ADR-0002）。讀 RPC 會在錯的時刻清零遮罩，讓玩家對一個從未接觸的新客人被判為 PassThrough。"
    adr: docs/architecture/adr-0003-solid-capsule-query.md
    added: 2026-09-28

  - pattern: owner_networkvariable_without_writeperm
    status: active
    description: "任何由 owner 寫入的 NetworkVariable 必須在建構子傳入 NetworkVariableWritePermission.Owner，並在 OnNetworkSpawn() 以 runtime guard 斷言 WritePerm == Owner。"
    why: "DefaultWritePerm 是 Server（NetworkVariableBase.cs:225），WritePerm 為 get-only、無 setter（:261-267）。漏掉建構子參數時 owner 的寫入被 CannotWrite() 丟棄（NetworkVariable.cs:151-152），值永遠停在初始值——功能靜默失效，而純 C# T0 測試看不到 Unity 轉接層的建構呼叫。"
    adr: docs/architecture/adr-0003-solid-capsule-query.md
    added: 2026-09-28

  - pattern: dllimport_outside_platform_web
    status: active
    description: "DllImport(__Internal) 只得出現在 NightShift.Platform.Web；遊戲程式碼中 #if UNITY_WEBGL 恰一處且位於該組件的註冊入口；Core 組件的 asmdef 不得引用 NightShift.Platform。"
    why: "每多一處 #if 就多一組會在桌面 build 靜默生效的 Editor 假值；桌面 IL2CPP 的原生連結期失敗在 Editor（Mono，P/Invoke 延遲解析）測不出。建置期 grep 與 asmdef 平台約束雙鎖，缺一不可。"
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    added: 2026-10-01

  - pattern: platform_stub_fake_values
    status: active
    description: "平台介面的非 Web 實作不得回傳佔位假值（如 (editor)、恆 1、以 Time.realtimeSinceStartup 冒充 performance.now()）；每項能力的桌面語意必須是等價行為或 ADR-0005 Decision 5 表中明寫的固定值；Editor 一律使用 Desktop 實作。"
    why: "W1WebProbe.cs:22-45 的 #else stub 在真正的桌面 build 會靜默生效：GetOnline() 永遠 1、離開通知永遠不送——與 ADR-0001 的 enableOverlapRecovery、ADR-0003 的 NetworkVariable 建構子參數同屬「預設值悄悄生效、沒有錯誤訊息」。"
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    added: 2026-10-01

  - pattern: desktop_without_run_in_background
    status: active
    description: "桌面實作的 IPageLifecycle.IsHidden 恆 false 以 Application.runInBackground = true 為前提；PlatformRoot 的 Desktop 分支必須在建構時斷言並強制設為 true。"
    why: "桌面放棄 netcode #17 的背景分流是刻意的（主迴圈不節流）；但 runInBackground 預設 false 時失焦即停主迴圈，Host 心跳中斷、整房被 #20 判離線，且沒有任何錯誤訊息。"
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    added: 2026-10-01

  - pattern: session_logic_outside_core
    status: active
    description: "任何 session 決策（要不要判斷線、能不能加入、該不該 teardown、slot 指派與回收、Host 消失排歧）不得住在 NetworkBehaviour／MonoBehaviour／UGS 回呼裡；轉接層只翻譯事件、執行 SessionMachine 吐出的效果。NightShift.Session.Core 的 asmdef noEngineReferences = true。"
    why: "TR-netcode-044 要求心跳／排歧／世代在 EditMode 純邏輯可測；W1 證明對沒人跑過的系統只有儀器能反駁斷言，而儀器必須在沒有 NGO、沒有 UGS 時也能跑。與 ADR-0001 movement_logic_outside_core 同一條紀律。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01

  - pattern: clientid_as_player_identity
    status: active
    description: "NGO clientId（ulong）不得作為任何遊戲狀態、遮罩、claim、roster、計數的玩家鍵；只准在 RPC 的 SenderClientId、OwnerClientId、連線回呼與 RpcTarget.Single 定址處出現，進 Core 前一律經 SlotTable.SlotOf() 換成 slot。"
    why: "重連配發新 clientId、OwnerClientId 不保證連續、Host 恆 0；以 clientId 為鍵的條目在重連後成為孤兒，PassThrough 側沒有任何保險絲（architecture-review §6 BLOCKING）。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01

  - pattern: lobby_with_live_relay
    status: active
    # r1 前：「不得存在 Relay allocation 或 NGO 連線」——與 Lobby* 沙盒在本機跑 NGO Host 字面衝突（r2 E11）
    description: "Lobby／Lobby* 期間不得存在 Relay allocation 或對外的 NGO 連線（Lobby* 的本機練習沙盒——SinglePlayerTransport 上的 NGO Host——除外）：建 session 不得呼叫 WithRelayNetwork()，Settlement → Lobby 必須 StopNetworkAsync()；心跳只在對外 NGO 連線存在期間運行。"
    why: "GDD #23／#23a 裁決；Lobby 多一層會逾時的即時連線（行動瀏覽器 Relay 10 s TTL 未驗，OQ#10），局間沒有乾淨的語意邊界，且 Lobby 期間占 Relay 連線分鐘。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03

  - pattern: relaynetworkoptions_protocol_ctor
    status: active
    description: "不得使用 RelayNetworkOptions 帶 RelayProtocol 參數的建構子（2.3.1 已 [Obsolete]）；協定只在 SessionOptions／JoinSessionOptions 的 WithNetworkOptions() 設定，StartRelayNetworkAsync 只收 new RelayNetworkOptions(region)。"
    why: "RelayNetworkOptions.cs:163-167 為唯一非 obsolete 建構子（region、preserveRegion）；把協定「修回」啟網那一刻會與 ADR-0005 的共用 helper 分叉，且 Host 端正常、加入端單獨拋 Mismatched 的不對稱失敗在本地測不出。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01

  - pattern: avatar_destroyed_with_owner
    status: active
    description: "玩家 avatar prefab 的 NetworkObject 必須 DontDestroyWithOwner = true（可攜道具同）；斷線處置的順序由 ADR-0006 的 DisconnectSequencer 掌握，第 5 步才顯式 despawn avatar；第 5 步之後，掉落的道具在每個留守 client 上都必須存活——不得只靠 NetworkVariable 傳達掉落。"
    why: "預設 false 時，NGO 在 OnClientDisconnectCallback 之前就 despawn＋destroy avatar（NetworkConnectionManager.cs:1366-1395）。Host 端會把子 NetworkObject 移到根節點而存活，client 端沒有這層保護（NetworkSpawnManager.cs:1664-1680、:1714），掛在手部 socket 的道具隨 avatar 一起消失——Host 有、client 沒有。NV 的 delta 要到下一個 tick 才送，一定晚於當下入列的 DestroyObjectMessage。AC10／AC14 只在真實斷線時紅燈。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03

  - pattern: avatar_ownership_callback_side_effects
    status: active
    description: "avatar 上的元件不得以 IsOwner／IsLocalPlayer 的即時值判斷「是不是本機玩家」，也不得在 OnGainedOwnership／OnOwnershipChanged 裡做輸入、攝影機或 HUD 綁定；本機玩家的判定在 OnNetworkSpawn() 快取一次。"
    why: "avatar 設 DontDestroyWithOwner = true 之後，NGO 在斷線時呼叫 RemoveOwnership()，也就是 ChangeOwnership(obj, 0)（NetworkSpawnManager.cs:457-467）；它不清 IsPlayerObject，於是 Host 上該 avatar 的 IsOwner 與 IsLocalPlayer 都變成 true（NetworkObject.cs:1232,1237），並觸發 ownership 回呼。依即時值綁定的元件，會把 Host 的輸入或攝影機接到斷線玩家的身體上。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03
