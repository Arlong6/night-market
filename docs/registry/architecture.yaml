    signal_signature: "分端來源（ADR-0006 r2 Decision 13）：PlayerJoined/PlayerLeft 是 Host Core 的事件；其他端以該 slot avatar 的 OnNetworkSpawn/OnNetworkDespawn 為準（OnNetworkDespawn 排除本機 ShutdownInProgress 與本機自己的 avatar；本機 avatar 的 OnNetworkSpawn（IsLocalPlayer）是本機進 InShift 的訊號，不是他人的 PlayerJoined；只限 NgoOwner == Online，練習沙盒的事件只進沙盒 Core）；OnConnectionEvent 的 PeerConnected/PeerDisconnected 只供記錄；Roster NV 只供 UI 與冪等補強；不得依賴 NV 與 Destroy/Create 的相對順序。PlayerJoined(byte slot, string playerId)；PlayerLeft(byte slot, string playerId)；PlayerDisconnected(byte slot, string playerId, heldItems)；OnlinePlayerCountChanged(int count, bool graceActive, bool hostSolo)；ConnectionStateChanged(ConnectionState)；RoomCodeAvailable(string code)；SessionStarted；RosterUpdated；FinalRoster／DisconnectLog。ConnectionState 枚舉是 UI 唯一的連線狀態來源，店語字串表 data-driven"
    referenced_by:
