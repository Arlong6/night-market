      # r2 前另列 lobby-ui「#12 Lobby 階段的 pagehide＋beforeunload 主動通知」——r3 FV-6 要求收斂為單一安裝者，且 beforeunload 永不送出
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    # r1 前：void InstallLeaveBeacon(string url, string payload)，Web 走 beforeunload→sendBeacon
    # r2 前：InstallLeaveBeacon(string url, string method, IReadOnlyDictionary<string,string> headers, string body = null)，pagehide 為主、beforeunload 備援——實際上由 beforeunload 送出，與確認框衝突（r3 FV-4）；.jslib 收不了字典（r3 EA-9）
    # r3 前：另有 event Action RestoredFromBackForwardCache（pageshow persisted 時觸發、只供記錄與測試，理由寫「WebSocket 已被瀏覽器關閉」——Chrome 不成立，r4 R4F-3）
    signal_signature: "void InstallLeaveBeacon(string url, string method, string authorization)（authorization 是完整標頭值、含「Bearer 」前綴，由 ADR-0006 LeaveBeaconPlan 產生，.jslib 原樣放進 Authorization 標頭；Web：只在 pagehide 送出 fetch keepalive、不分 persisted，無 body；.jslib 單發旗標只擋 bfcache 往返後的第二次 pagehide；重複呼叫即覆寫；Desktop no-op）；void ClearLeaveBeacon()；void SetLeaveConfirmation(bool armed)（armed 時才掛 beforeunload，處理器只 preventDefault＋returnValue、永不送出；Safari 對跨源 iframe 不跳框）；pageshow persisted 時 .jslib 自行寫一行 console.info 並 location.reload()，C# 端無事件、無介面（r3 刪去 r2 的 event Action RestoredFromBackForwardCache：重載前同步觸發、沒有消費者，r4 R4C-25）；event Func<bool> QuitRequested（Desktop：Application.wantsToQuit 回 false 延後退出；Web 不觸發）；void CompleteQuit()（Desktop：設旗標後 Application.Quit()，第二次 wantsToQuit 回 true；呼叫端在「NGO 已停且 leave／delete 的 Task 已完成」或 1 s 逾時後才呼叫，只等 SDK 那一次呼叫、不等移除重試；沒有 leave／delete 在途時（Duplicate、Solo）只等 NGO 已停，已在 Idle 時 QuitRequested 直接回 true，ADR-0006 Decision 9）。visibilitychange 不得作為送出點"
    referenced_by:
      - docs/architecture/adr-0005-platform-abstraction-layer.md
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-12   # r1：sendBeacon 帶不了 Authorization，改 keepalive fetch＋headers；補 pagehide 與送出端去重（r2 X2）；r2：只在 pagehide 送出、確認框介面、bfcache 恢復事件、三個字串參數、單一安裝者、CompleteQuit 語意（r3 FV-4、FV-6、EA-7、EA-9）；r3：刪去 RestoredFromBackForwardCache（r4 R4C-25）、SetLeaveConfirmation 只由 Online Core 驅動（M3）、CompleteQuit 只等 SDK 那一次呼叫（K13）；r3 依審查：沒有 leave／delete 在途時只等 NGO 已停

