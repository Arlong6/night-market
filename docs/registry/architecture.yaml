  - contract: page_lifecycle
    status: active
    pattern: direct_call   # IPageLifecycle：可見性＋單調時鐘＋連線狀態；HiddenChanged 為邊緣事件
    producer: platform-services（NightShift.Platform；Web 實作 .jslib、Desktop 實作原生 API）
