      - hud               # ping 顯示（同一次往返）
      - game-clock        # offset 估計（G9）
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    signal_signature: "[Rpc(SendTo.Server, Delivery = RpcDelivery.Unreliable)] HeartbeatToHostRpc(HeartbeatWire, RpcParams)；[Rpc(SendTo.SpecifiedInParams, Delivery = RpcDelivery.Unreliable)] HeartbeatToClientRpc(HeartbeatWire, RpcParams) 以 RpcTarget.Single 定址；payload 邏輯 20 bytes { ushort Seq; ushort LastPeerSeqSeen; long HostShiftEndTsMs; long HostNowMs }——RPC 參數是轉接層的 HeartbeatWire : INetworkSerializable（逐欄序列化），Core 的 HeartbeatPayload 是純 BCL readonly struct；不用 ForceNetworkSerializeByMemcpy（線上格式綁原生佈局）；每 heartbeat_interval_sec 2 s 一拍、heartbeat_timeout_sec 8 s 判定；unreliable 上限 1296 bytes"
    referenced_by:
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r1：16 bytes 更正為 20；RPC 參數改 HeartbeatWire（r2 E8）

# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets: []

# Example:
#
# performance_budgets:
