  - purpose: session_network_handler
    status: active
    api: "NGO 啟停的唯一擁有者是轉接層的 SessionNetworkHandler : Unity.Services.Multiplayer.INetworkHandler，由 SessionServices 唯一的 options 工廠以 WithNetworkHandler 掛在建房、加入、復原的 options 上（不經 ADR-0005；Host 與 client 共用，一個 session 一個實例）。初始化路徑上 handler 讀不到 session（RegisterSession 在模組初始化之後），所以轉接層在 H7 斷言通過後才 Bind(session)。契約：H1 client 啟網前等沙盒收場（AttemptStarted 時由 Online Core 輸出 AbortSandbox；沙盒仍在（含其 NGO 尚未停妥）時另送冪等的 NetworkJoinRequested）、斷言 UnityTransport，已 Bind 時前後兩次比對 _session_network（未 Bind 時略過，不得把讀不到當成缺席而 throw），StartClient 之前再比一次世代（閘門期間這次加入可能已被放棄）；H2 approval 拒絕（JoinRejectReason，或 connected 前的 NGO 通用字串＝StaleBuild）記為 Rejected 並正常返回、永不 throw；H3 真故障才 throw SessionException；H4 Host 路徑全程同步、不在 handler 內等待：進入時斷言 NGO 已完全停止且距上次 stopped ≥ 1 幀（不成立即 throw，#26 以 StartFailed 失敗、Host 留在 Lobby；前提由 Core 的 #26 守衛與 handler 之前的兩次 Relay REST 共同保證），一律 StartHost，false 即 throw，true 即回傳已完成的 Task；handler 成功後 MPS 寫屬性失敗時，轉接層在同一個同步段內 StopAsync 並以 ShiftEnded 斷開已連上的 client，再經 HostPropertyWriter 立即存出撤回（_session_network＝null＋shift_eta(Lobby)，失敗還原非 null 值後退避重試，shift_seq 不回收），Core 走 ShiftStartAborted(retractionPending: true)；H5 StopAsync 冪等、永不 throw、永不懸掛、只停自己啟動的 NGO；H6 以 session 世代隔離：世代只在離開 session 或放棄進行中的加入時加一（Teardown 開始、CreatingRoom／JoiningRoom 的計時失敗出口、復原的重新加入撞到 T_lobby 或後備期限、復原的世代加一步驟）；#26 轉場的計時失敗不加一（同一 session 已掛上的 handler 跨班次重用只在世代不變時成立；那次嘗試改以 H5 的取消結束、依 H3 throw）；StartAsync 入口（Client 與 Host 皆然，早於 AttemptStarted 與寫入 NgoOwner）世代不符即 throw SessionException——初始化路徑上 SDK 自己 leave、屬性變更路徑只發 StartFailed（r3 依 r4 R4C-13）；放棄進行中的加入時先記下被放棄的世代 g 再加一，NgoOwner == {Online, g} 就 Shutdown()、仍在閘門中的世代 g handler 以 H5 的取消結束，遲到的回傳只剩過期世代 LeaveAsync；H7 建房與加入後斷言 session.Network.NetworkHandler == h，通過即 Bind（失敗且模組仍 Stopped 時以 setter 補掛）。Core 的 NetworkStarted／NetworkStopped／JoinRejected 只從 handler 觀察到的 NGO 狀態產生；連線之後的停機在 stopped 當下快照 DisconnectReason，經 DisconnectReasonParser.ClassifyStop 分類為 ShiftEnded／Other，以 NetworkStopped(cause) 送進 Core（r3）"
    not: MPS 預設的 GameObjectsNetcodeNetworkHandler（internal，被拒即 throw → 初始化路徑上 SDK 先 leave，Lobby* 不可達）；在 handler 外呼叫 StartClient／StartHost（Solo 與 Lobby* 沙盒除外）；以 IClientSessionNetwork.State 判斷是否已連線；在 stopped 回呼內同步完成 Task（MPS 會在 NGO 關機途中重入）
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    reason: "r3 FV-1：MPS 2.3.1 在初始化路徑上，handler 一拋例外就 CleanupSessionAsync → LeaveAsync（SessionManager.cs:311-347）；handler 正常返回則模組設 Started、不發 StartFailed、不 leave（NetworkModule.cs:470-477）。MPS 內只有預設 handler 訂閱 NGO 事件，沒有任何從 NGO 斷線到 leave 的路徑。這份契約違反 INetworkHandler 文件註解的兩句：StartAsync「Task 完成後 client 應已連線」（H2 被拒時正常返回）與 StopAsync「Task 完成後不應再連線或接受連線」（H5 在 Shutdown() 只設旗標時就回傳）（INetworkHandler.cs:20-22、:34-36）；MPS 2.3.1 都未強制，升版必重驗（V1、V13）。arlong 2026-10-03 裁決"
