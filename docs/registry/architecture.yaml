  - purpose: interaction_rpc_response_target
    status: active
    api: RpcTarget.Single(rpcParams.Receive.SenderClientId, RpcTargetUse.Temp)（執行期定址，RpcTarget.cs:257）
    not: SendTo.Everyone；SendTo.Owner
    adr: docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    reason: "Everyone 會讓無關 client 收到別人的 RejectReason 並誤播撲空；Owner 解析的是掛載 RPC 的 NetworkObject 的 owner——方法若被搬到站台的 NetworkBehaviour 上，回應會悄悄送給 Host 自己而不報錯。執行期定址不受掛載位置影響"
    referenced_by:
      - docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    added: 2026-09-27
    revised: ""

# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: movement_logic_outside_core
    status: active
    description: "移動／碰撞的任何決策邏輯（速度斜坡、解除穿透、預算夾制、有向對狀態機）不得住在 MonoBehaviour 或任何引用 UnityEngine／Unity.Netcode／InputSystem 的組件裡；轉接層不得重新實作 Core 已算過的任何一段。"
    why: "31 條 T0 AC 的可執行性建立在 Core 組件 noEngineReferences = true 上；邏輯一漏到轉接層，T0 就塌成 T1/T2。noEngineReferences 只擋隱式參照，故建置期另以 grep 擋顯式參照。"
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26

  - pattern: owner_truth_in_collision
    status: active
    description: "碰撞解算不得讀取他人的權威位置（NetworkTransform 權威狀態、RPC 攜帶的位置）；唯一來源是內插後的 transform，經 readonly struct CapsuleGhost 傳入。"
    why: "GDD C8：擋住我的永遠是我螢幕上那具身體，這是判準 1（可歸因性）的技術保證；改讀真值等於位置回滾，netcode Core Rule #5 明文排除。AC8a/AC8b 釘住。"
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26

  - pattern: charactercontroller_adds_motion
    status: active
    description: "任何讓 CharacterController.Move() 注入求解器以外位移的設定都禁止：stepOffset > 0、slopeLimit > 0、enableOverlapRecovery = true。這三個 inspector 值是契約的一部分，以 T1 測試釘住。"
    why: "C12 的單幀預算必須在整條鏈路成立；enableOverlapRecovery 預設 true，會在與靜態幾何重疊時由 PhysX 依重疊深度推出，推出量不受預算夾制、方向與 delta 無關（netcode AC40 的過場結束情境會踩到）。"
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26

  - pattern: networktransform_setstate_on_local
    status: active
    description: "對本機玩家自己的 NetworkTransform 呼叫 SetState() 一律禁止。"
    why: "SetState() 是 authority 端唯一會直接回寫 transform 的公開 API（SetStateInternal → transform.SetPositionAndRotation），等於班次中傳送，違反 C12 推論 3；AC12② 在 Unity 層沒有型別保護，只有這條紀律。日後 #11 若需傳送，須先為 AC23 加明文豁免。"
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26

