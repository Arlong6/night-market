# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: remote_player_pose
    status: active
    pattern: shared_resource   # stock NetworkTransform，不另建管道（C16）
    producer: first-person-controller
    consumers:
      - first-person-controller   # 他端：內插後 transform → CapsuleGhost（C8）
      - customer-system            # #7：NPC 本地避讓查詢
      - hud                        # #11：攝影機 transform、PassThrough 顯示
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    signal_signature: "NetworkTransform：同步 position + yaw；不同步 pitch（C6）；AuthorityMode = Owner 顯式；每 tick 至多一次（10 Hz，專案值）"
    referenced_by:
      - docs/architecture/adr-0002-horizontal-only-interaction-validation.md
      - docs/architecture/adr-0001-pure-csharp-movement-solver.md
    added: 2026-09-26
    revised: ""

