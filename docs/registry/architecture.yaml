  - contract: interact_request
    status: active
    pattern: rpc
    producer: player-client（每位玩家自己的 NetworkBehaviour）
    consumers:
      - host-interaction-validator   # #5：InteractValidator.Validate，純 C#
    adr: docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    signal_signature: "[Rpc(SendTo.Server)] RequestInteractRpc(int stationId, uint claimGenerationSeen, float selfX, float selfZ, float selfYawDeg, RpcParams)；回應以 RpcTarget.Single(rpcParams.Receive.SenderClientId) 送回 RejectReason；claim 狀態經 NetworkVariable 回呼得知，不從回應推斷"
    referenced_by:
      - docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    added: 2026-09-27
    revised: ""

# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

