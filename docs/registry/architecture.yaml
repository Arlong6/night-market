  - contract: disconnect_sequence
    status: active
    pattern: direct_call   # IDisconnectParticipant，依 Priority 固定順序，同幀同步，上限 disconnect_cleanup_sec 2 s
    producer: netcode-session（DisconnectSequencer；PeerLost 冪等）
    consumers:
      - first-person-controller   # Priority 0 FreezeInput
      - object-lifecycle          # Priority 10 DropHeldItems、40 DespawnAvatar（G2）；avatar 與道具皆 DontDestroyWithOwner = true，道具須在每個 client 上存活（ADR-0006 r1 Decision 7 前提）
      - machine-interaction       # Priority 20 ReleaseClaims：只釋放 claim、ClaimGeneration+1，不判 Failed（C10）
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    signal_signature: "void IDisconnectParticipant.OnPeerLost(in PeerLostContext{ byte Slot; string PlayerId; PeerLostCause Cause; PeerPhase Phase; long NowMs })；Priority：FreezeInput=0, DropHeldItems=10, ReleaseClaims=20, Roster=30, DespawnAvatar=40, DisconnectTransport=45（cause ≠ TransportDisconnect 時 NetworkManager.DisconnectClient(clientId, 非空 reason)；空 reason 會同步斷線並在本幀重入）, ReleaseMembership=50（session.AsHost().RemovePlayerAsync，Host 唯一寫入者）, Resample=60；Phase == Onboarding 時第 1、2、3、7 步不做事，第 4 步只釋放 slot、不發 PlayerLeft"
    referenced_by:
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r1：補 DisconnectTransport=45（r2 E6）與 PeerLostContext.Phase（r2 E4）

  - contract: approval_payload
    status: active
    pattern: rpc   # NGO ConnectionApprovalCallback 握手；截止閘門與版本閘的唯一執行點
    producer: player-client（NetworkConfig.ConnectionData）
    consumers:
      - netcode-session   # Host：ApprovalGate.Evaluate（純函式）
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    signal_signature: "ConnectionData ≤ 72 bytes：byte PayloadVersion=1、ushort ProtocolVersion、uint BuildId、byte n、PlayerId UTF-8[n]；拒絕順序 StaleBuild → NotAMember → Duplicate → LateJoinCutoff → Full，否則 Approve(slot)；response.Reason = JoinRejectReason 枚舉名（店語在 client 翻譯）；Host 自核准：HostView.MemberIds 必含 Host 自己（Online＝session.Players；Solo／Lobby* 沙盒＝{ 本機 PlayerId }），StartHost() 後斷言 SlotOf(0) == 0 且 LocalClient.PlayerObject != null——NGO 對 Host 的拒絕只記警告就核准，並照 CreatePlayerObject 決定建不建 avatar（NetworkManager.cs:1510-1516）"
    referenced_by:
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r1：RejectReason 改名 JoinRejectReason（r2 X4）；補 Host 自核准（r2 E2）

  - contract: session_heartbeat
    status: active
    pattern: rpc   # 自 NGO 連線起至 StopNetwork；涵蓋 Onboarding／InShift／Settlement；Lobby 不跑
    producer: netcode-session（SessionRoot，Host 擁有、啟網後第一個 Spawn）
    consumers:
