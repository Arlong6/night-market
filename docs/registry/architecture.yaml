  - pattern: unbounded_client_pose_trust
    status: active
    description: "Host 使用任何 client 自報的姿態（位置、朝向）之前，必須先以自己的複製品綁住：|自報 − 複製品| ≤ tol_lag（player_move_speed_max × host_view_lag_p95_sec），否則拒絕為 PoseOutOfBound。yaw 不綁（複製落後超過一圈且作弊價值為零），但位置必綁。"
    why: "Host 對 client 只有內插後、落後 ≥ 200 ms 的複製品（NGO 2.13.2 無不繼承的旁路），不能直接拿它精確驗；但完全相信自報等於讓改封包者隔牆互動。綁住之後作弊包絡有界且可實測，容差只花在反作弊上不花在合法玩家身上。"
    adr: docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    added: 2026-09-27

  - pattern: claimstate_read_from_rpc_response
    status: active
    description: "client 端不得以「收到互動 RPC 回應」推斷本機的 ClaimState NetworkVariable 已同步更新；所有依賴 claim 狀態的顯示只讀 NetworkVariable 回呼。"
    why: "RPC 與 NetworkVariable 共用同一條 per-client FIFO（NetworkMessageManager.cs:75）但入列時機不同（RPC 呼叫當下、NetworkVariable 每 tick 收集），NGO 不保證順序，官方文件明講 NetworkVariable 只是 eventually consistent。"
    adr: docs/architecture/adr-0002-horizontal-only-interaction-validation.md
    added: 2026-09-27

  - pattern: npc_presence_from_rpc_event
    status: active
    description: "任何依 NPC 在場狀態做決策的邏輯（含 PassThrough 遮罩的清零時機、避讓集合的建立）必須讀 NPC 的 NetworkVariable 狀態，不得讀 NpcStateChanged RPC 事件本身。"
    why: "netcode-session.md:823-826 已裁定狀態真相走 NetworkVariable、RPC 只驅動表現層；且 RPC 與 NetworkVariable 送達順序無保證（ADR-0002）。讀 RPC 會在錯的時刻清零遮罩，讓玩家對一個從未接觸的新客人被判為 PassThrough。"
    adr: docs/architecture/adr-0003-solid-capsule-query.md
    added: 2026-09-28

  - pattern: owner_networkvariable_without_writeperm
    status: active
    description: "任何由 owner 寫入的 NetworkVariable 必須在建構子傳入 NetworkVariableWritePermission.Owner，並在 OnNetworkSpawn() 以 runtime guard 斷言 WritePerm == Owner。"
    why: "DefaultWritePerm 是 Server（NetworkVariableBase.cs:225），WritePerm 為 get-only、無 setter（:261-267）。漏掉建構子參數時 owner 的寫入被 CannotWrite() 丟棄（NetworkVariable.cs:151-152），值永遠停在初始值——功能靜默失效，而純 C# T0 測試看不到 Unity 轉接層的建構呼叫。"
    adr: docs/architecture/adr-0003-solid-capsule-query.md
    added: 2026-09-28

  - pattern: dllimport_outside_platform_web
    status: active
    # r2 前：#if UNITY_WEBGL 恰一處且位於 .Web 的註冊入口（與 ADR-0005 架構圖、Migration 3 的「在 PlatformRoot」互相矛盾，r3 CX-8）
    description: "DllImport(__Internal) 只得出現在 NightShift.Platform.Web；遊戲程式碼中任何含 UNITY_WEBGL 的前置處理式（#if 或 #elif）恰一處、位於組合根 PlatformComposition.Create()，且必須帶 !UNITY_EDITOR；Core 組件的 asmdef 不得引用 NightShift.Platform。"
    why: "每多一處 #if 就多一組會在桌面 build 靜默生效的 Editor 假值；桌面 IL2CPP 的原生連結期失敗在 Editor（Mono，P/Invoke 延遲解析）測不出。Editor＋WebGL target 同時定義 UNITY_EDITOR 與 UNITY_WEBGL（W1 rsp），只寫 #if UNITY_WEBGL 會在 Editor 走 Web 分支。建置期 grep（^\\s*#\\s*(if|elif).*UNITY_WEBGL）與 asmdef 平台約束雙鎖，缺一不可。"
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    added: 2026-10-01
    revised: 2026-10-03   # r2：位置統一為組合根、#elif 也算、必須帶 !UNITY_EDITOR（r3 CX-8）

  - pattern: platform_stub_fake_values
    status: active
    description: "平台介面的非 Web 實作不得回傳佔位假值（如 (editor)、恆 1、以 Time.realtimeSinceStartup 冒充 performance.now()）；每項能力的桌面語意必須是等價行為或 ADR-0005 Decision 5 表中明寫的固定值；Editor 一律使用 Desktop 實作。"
    why: "W1WebProbe.cs:22-45 的 #else stub 在真正的桌面 build 會靜默生效：GetOnline() 永遠 1、離開通知永遠不送——與 ADR-0001 的 enableOverlapRecovery、ADR-0003 的 NetworkVariable 建構子參數同屬「預設值悄悄生效、沒有錯誤訊息」。"
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    added: 2026-10-01

  - pattern: desktop_without_run_in_background
    status: active
    # r2 前：「PlatformRoot 的 Desktop 分支」斷言——該分支已隨組合根改寫而不存在
    description: "桌面實作的 IPageLifecycle.IsHidden 恆 false 以 Application.runInBackground = true 為前提；DesktopPlatformServices 的建構子必須斷言並強制設為 true。"
    why: "桌面放棄 netcode #17 的背景分流是刻意的（主迴圈不節流）；但 runInBackground 預設 false 時失焦即停主迴圈，Host 心跳中斷、整房被 #20 判離線，且沒有任何錯誤訊息。"
    adr: docs/architecture/adr-0005-platform-abstraction-layer.md
    added: 2026-10-01
    revised: 2026-10-03   # r2：斷言位置改到 DesktopPlatformServices（r3 CX-8）

  - pattern: session_logic_outside_core
    status: active
    # r2 前：決策清單未列看門狗與復原
    description: "任何 session 決策（要不要判斷線、能不能加入、該不該 teardown、slot 指派與回收、Host 消失排歧，以及 r2 的看門狗武裝／觸發與復原的次數、退避、用盡——JoinWatchdog／RecoveryPolicy）不得住在 NetworkBehaviour／MonoBehaviour／UGS 回呼裡；轉接層只翻譯事件、執行 SessionMachine 吐出的效果。NightShift.Session.Core 的 asmdef noEngineReferences = true。"
    why: "TR-netcode-044 要求心跳／排歧／世代在 EditMode 純邏輯可測；W1 證明對沒人跑過的系統只有儀器能反駁斷言，而儀器必須在沒有 NGO、沒有 UGS 時也能跑。與 ADR-0001 movement_logic_outside_core 同一條紀律。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r2：看門狗與復原的判定屬 Core（r2 草稿審查；SessionNetworkHandler 的 H1–H5 是 MPS 協定層的機械規則，不在此限）

  - pattern: clientid_as_player_identity
    status: active
    # r2 前：「只准在 RPC 的 SenderClientId、OwnerClientId、連線回呼與 RpcTarget.Single 定址處出現」
    description: "NGO clientId（ulong）不得作為任何遊戲狀態、遮罩、claim、roster、計數的玩家鍵；只准在 RPC 的 SenderClientId、OwnerClientId、連線回呼、RpcTarget.Single 定址，以及轉接層對 NGO 的呼叫（SpawnAsPlayerObject、DisconnectClient）處出現，進 Core 前一律經 SlotTable.SlotOf() 換成 slot。唯一例外是 SessionRoot.Roster 的 ClientId 欄：它是 slot 的占用世代，只准比較「變了沒」，不得拿來查表、定址或當鍵（ADR-0006 r2 Decision 13）。"
    why: "重連配發新 clientId、OwnerClientId 不保證連續、Host 恆 0；以 clientId 為鍵的條目在重連後成為孤兒，PassThrough 側沒有任何保險絲（architecture-review §6 BLOCKING）。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r2：容許 Roster.ClientId 作占用世代、補 NGO 呼叫端（r3 CX-2、arlong 裁決②）

  - pattern: lobby_with_live_relay
    status: active
    # r1 前：「不得存在 Relay allocation 或 NGO 連線」——與 Lobby* 沙盒在本機跑 NGO Host 字面衝突（r2 E11）
    # r2 前（r1 版）：「Lobby／Lobby* 期間不得存在 Relay allocation 或對外的 NGO 連線（Lobby* 的本機練習沙盒除外）」——r2 被拒的 Lobby* 端在 SDK 帳面上保留 join allocation
    description: "Lobby／Lobby* 期間不得存在 Relay allocation 或對外的 NGO 連線。例外兩項：Lobby* 的本機練習沙盒（SinglePlayerTransport 上的 NGO Host）；以及因 approval 被拒而進 Lobby* 的一端——MPS 網路模組仍報 Started，並在帳面上保留那筆已斷線的 join allocation，直到 Host #23a 移除網路屬性（NetworkModule.cs:470-477、:720-735），不是連線，不得據此判斷有無連線。其餘：建 session 不得呼叫 WithRelayNetwork()，Settlement → Lobby 必須 StopNetworkAsync()；心跳只在對外 NGO 連線存在期間運行。"
    why: "GDD #23／#23a 裁決；Lobby 多一層會逾時的即時連線（行動瀏覽器 Relay 10 s TTL 未驗，OQ#10），局間沒有乾淨的語意邊界，且 Lobby 期間占 Relay 連線分鐘。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r1：本機沙盒例外（r2 E11）；r2：被拒 Lobby* 端的帳面 allocation 例外（r3 FV-1、arlong 裁決①）

  - pattern: relaynetworkoptions_protocol_ctor
    status: active
    description: "不得使用 RelayNetworkOptions 帶 RelayProtocol 參數的建構子（2.3.1 已 [Obsolete]）；協定只在 SessionOptions／JoinSessionOptions 的 WithNetworkOptions() 設定，StartRelayNetworkAsync 只收 new RelayNetworkOptions(region)。"
    why: "RelayNetworkOptions.cs:163-167 為唯一非 obsolete 建構子（region、preserveRegion）；把協定「修回」啟網那一刻會與 ADR-0005 的共用 helper 分叉，且 Host 端正常、加入端單獨拋 Mismatched 的不對稱失敗在本地測不出。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01

  - pattern: avatar_destroyed_with_owner
    status: active
    # r2 前：「第 5 步才顯式 despawn avatar」，未規定 spawn 時點（approval 即建）、destroy 與否、可否池化
    description: "玩家 avatar prefab 的 NetworkObject 必須 DontDestroyWithOwner = true（可攜道具同）；avatar 在 PlayerJoined 才由轉接層 SpawnAsPlayerObject（approval 回 CreatePlayerObject = false、NetworkConfig.PlayerPrefab = null；spawn 前同步確認 clientId 仍在線、每個 client 只 spawn 一次）；斷線處置的順序由 ADR-0006 的 DisconnectSequencer 掌握，第 5 步才顯式 Despawn(destroy: true)，同步完成、不得池化；第 5 步之後，掉落的道具在每個留守 client 上都必須存活——不得只靠 NetworkVariable 傳達掉落。"
    why: "預設 false 時，NGO 在 OnClientDisconnectCallback 之前就 despawn＋destroy avatar（NetworkConnectionManager.cs:1366-1395）。Host 端會把子 NetworkObject 移到根節點而存活，client 端沒有這層保護（NetworkSpawnManager.cs:1664-1680、:1714），掛在手部 socket 的道具隨 avatar 一起消失——Host 有、client 沒有。NV 的 delta 要到下一個 tick 才送，一定晚於當下入列的 DestroyObjectMessage。AC10／AC14 只在真實斷線時紅燈。r2：池化或非同步的第 5 步會讓 RemoveOwnership 後仍帶 IsPlayerObject 的孤兒 avatar 被晚加入者誤認為 Host 的 PlayerObject（NetworkSpawnManager.cs:124-160）；對已斷線的 clientId SpawnAsPlayerObject 會被 AddClient 加回成永遠清不掉的鬼 client（:127-131）；重複 spawn 會留下一具第 5 步抓不到的舊 avatar（:134-139）。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03
    revised: 2026-10-03   # r2：延後 spawn、Despawn(true) 同步不池化（r3 CX-6、arlong 裁決②）

  - pattern: avatar_ownership_callback_side_effects
    status: active
    # r2 前：未列 ADR-0002／0003 的元件，未規定綁定掛點（延後 spawn 前不存在這個問題）
    description: "avatar 上的元件（含 ADR-0001 的移動、ADR-0002 的互動 RPC、ADR-0003 的遮罩元件）不得以 IsOwner／IsLocalPlayer 的即時值判斷「是不是本機玩家」，也不得在 OnGainedOwnership／OnOwnershipChanged 裡做輸入、攝影機或 HUD 綁定；本機玩家的判定在 OnNetworkSpawn() 快取一次，綁定也掛在 OnNetworkSpawn（IsLocalPlayer）——不掛 OnClientConnectedCallback（延後 spawn 下那時 PlayerObject 還是 null），不依賴 OnNetworkSessionSynchronized（晚 spawn 的物件收不到），OnNetworkSpawn 內不讀 LocalClient.PlayerObject。"
    why: "avatar 設 DontDestroyWithOwner = true 之後，NGO 在斷線時呼叫 RemoveOwnership()，也就是 ChangeOwnership(obj, 0)（NetworkSpawnManager.cs:457-467）；它不清 IsPlayerObject，於是 Host 上該 avatar 的 IsOwner 與 IsLocalPlayer 都變成 true（NetworkObject.cs:1232,1237），並觸發 ownership 回呼。依即時值綁定的元件，會把 Host 的輸入或攝影機接到斷線玩家的身體上。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03
    revised: 2026-10-03   # r2：適用範圍擴及 ADR-0002／0003 的 avatar 元件（r3 CX-7）、延後 spawn 下的綁定時點

  - pattern: ngo_start_outside_session_handler
    status: active
    description: "Online 模式下，NGO 的 StartClient／StartHost 只得由 SessionNetworkHandler 呼叫（Solo 與 Lobby* 練習沙盒的本機 StartHost 除外，經 TransportSwitch）；MPS 預設的 GameObjectsNetcodeNetworkHandler 不得被使用——建房與加入後斷言 session.Network.NetworkHandler 為自有 handler。"
    why: "預設 handler 在 approval 拒絕時拋例外，MPS 的初始化路徑因此先 leave，被截止擋下的中途加入者在拿到 ISession 之前就不是成員（r3 FV-1）；ProcessOptions 吞掉 option 套用時的例外，只記一行 LogError（「Process Options Exception」）就繼續建房／加入，呼叫端拿不到例外，handler 退回預設（SessionManager.cs:390-397）。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03

  - pattern: disconnectclient_without_reason
    status: active
    description: "專案程式碼不得呼叫 NetworkManager.DisconnectClient(ulong) 的單參數多載，也不得傳 null 或空字串的 reason；一律 DisconnectClient(clientId, 非空原因代碼)。"
    why: "單參數多載會補上通用字串 'Client-{id} disconnected by server.'（NetworkManager.cs:1570）——ADR-0006 靠它在 connected 之前辨識 NGO 連線設定雜湊的拒絕（歸 StaleBuild），專案自己也用它就失去辨識力；null／空 reason 則會同步斷線、在本幀重入斷線序列（NetworkConnectionManager.cs:917-931）。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03

  - pattern: presence_from_connection_events
    status: active
    description: "NGO 連線存在期間（Onboarding／InShift／Settlement，且只限 NgoOwner == Online），「哪個 slot 有人在場」與逐 slot 的清理只得以本端看到的 avatar NetworkObject 生命週期為準（Host 端另有 Core 的 PlayerJoined／PlayerLeft）；不得以 NetworkManager.OnConnectionEvent 的 PeerConnected／PeerDisconnected、SessionRoot.Roster 的 NV 變化、或 MPS 的成員事件作為這類在場或清理的觸發點，也不得在 avatar 的 OnNetworkSpawn／OnNetworkDespawn 內拿 Roster 交叉驗證；OnNetworkDespawn 必須排除本機 ShutdownInProgress 與本機自己的 avatar。MPS 成員事件仍是成員資格的來源：Lobby／Lobby* 的名單、Host 消失排歧（ADR-0006 Decision 8）與 approval 的 MemberIds 不受本條限制。"
    why: "PeerConnected 在 approval 當下就觸發、比 PlayerJoined 早 3 s 以上；PeerDisconnected 相對 avatar despawn 的先後在傳輸斷線與心跳逾時兩種觸發源之間翻轉；Roster 的 NV delta 晚一個 tick，ChangeOwnership 又會強制先送出 dirty NV；MPS 事件只代表成員資格、晚秒級（ADR-0006 r2 Decision 13，r3 CX-2）。"
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-03
