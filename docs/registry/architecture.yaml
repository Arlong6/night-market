    signal_signature: "void InstallLeaveBeacon(string url, string method, IReadOnlyDictionary<string,string> headers, string body = null)（Web：pagehide 為主、beforeunload 備援 → fetch keepalive，.jslib 單發旗標只送第一次；重複呼叫即覆寫；Desktop no-op）；void ClearLeaveBeacon()（正常離開房間時拆除）；event Func<bool> QuitRequested（Desktop：Application.wantsToQuit 回 false 延後退出；Web 不觸發）；void CompleteQuit()"
    referenced_by:
