  - state: pass_through_flags
    status: active
    owner_system: first-person-controller（owner 端寫；轉接層承載）
    adr: docs/architecture/adr-0003-solid-capsule-query.md
    interface: "玩家 NetworkObject 上的 NetworkVariable<ulong> PassThroughNpcMask（bit = NPC id）與 NetworkVariable<byte> PassThroughPlayerMask（bit = slot）；ReadPermission.Everyone；只在 PairMachine 轉移時以 .Value 賦值。這是 directed_pair_state 的複製編碼，不是第二個真相源"
    write_access: owner-only   # NetworkVariableWritePermission.Owner，必須在建構子指定（預設是 Server）
    referenced_by:
      - docs/architecture/adr-0003-solid-capsule-query.md
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-09-28
    revised: ""

  - state: session_roster
    status: active
    owner_system: netcode-session（Host 端 SlotTable；NightShift.Session.Core）
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    # r2 前：RosterEntry 為 { PlayerId, ClientId, Online, JoinedTick }，未規定非 Host 端的在場來源
    interface: "Host 寫、Everyone 讀的 NetworkVariable<RosterState> SessionRoot.Roster（固定 4 格：PlayerId（UTF-8 ≤ 61 bytes）、ClientId（占用世代：單調、不重用，判斷 slot 換人看它）、Phase（PeerPhase）、Online（PlayerJoined 已發、PlayerLeft 未發）、JoinedTick）——只供 UI 與冪等補強，不是在場的來源：各端的在場來源是該 slot avatar 的 OnNetworkSpawn／OnNetworkDespawn（ADR-0006 r2 Decision 13）；遊戲系統只以 slot（byte）為玩家鍵；clientId 只在 NGO 邊界經 SlotTable.SlotOf()/ClientOf() 轉換；PlayerLeft(slot) 先於同 slot 的 PlayerJoined，且相隔 ≥ 3.0 s"
    write_access: host-only   # Decision 4；MVP 離線即回收 slot，Post-MVP 保留 reconnect_window_sec
    referenced_by:
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r2：補 Phase、ClientId 世代語意、Roster 不是在場來源（r3 CX-2）

  - state: shift_end_ts
    status: active
    owner_system: netcode-session（SessionRoot）
    adr: docs/architecture/adr-0006-netcode-session-lifecycle.md
    interface: "NetworkVariable<long> SessionRoot.ShiftEndTs（ms，Host 單調時鐘基準）；end_shift_early 直接改寫；所有「班次剩餘」的權威判定在 Host（approval 閘門即依此）；client 倒數為套用心跳 offset 後的估計值。沒有 NGO 連線的端（加入後的 Lobby、Lobby* 等待畫面）不讀本值，改讀 session property shift_eta = { phase, shift_seq, remaining_ms, published_utc_ms }（Member 可見）：remaining = clamp(remaining_ms − (utc_now − published_utc_ms), 0, remaining_ms)；shift_seq 每次 #26 +1，供看門狗判斷新班已開始。初值＝Host 在 OnServerStarted 寫入 nowMs + shift_length_sec（GDD 的「建立時刻」），在 SessionRoot spawn 之前；#26 的 shift_eta 與 _session_network、#23a 的 shift_eta(Lobby) 與屬性移除，各自同一次存檔送出（ADR-0006 r2 Decision 5）"
    write_access: host-only   # Decision 13；G9 遊戲時鐘消費
    referenced_by:
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-10-01
    revised: 2026-10-03   # r1：補「無 NGO 連線的端改讀 shift_eta」（r2 E5）；r2：shift_eta 加 shift_seq 與 published_utc_ms，晚到的讀者也成立（r3 FV-2）；初值時點與寫入配對（r3 FV-3）。r2 前：讀者為「Lobby 預檢、Lobby* 等待畫面」；shift_eta = { phase, remaining_ms }，收到時以本機單調時鐘錨定；初值時點未定

# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: remote_player_pose
    status: active
    pattern: shared_resource   # stock NetworkTransform，不另建管道（C16）
    producer: first-person-controller
    consumers:
      - first-person-controller   # 他端：內插後 transform → CapsuleGhost（C8）
      - customer-system            # #7：NPC 本地避讓查詢
      - hud                        # #11：攝影機 transform、PassThrough 顯示
    adr: docs/architecture/adr-0001-pure-csharp-movement-solver.md
    signal_signature: "NetworkTransform：同步 position + yaw；不同步 pitch（C6）；AuthorityMode = Owner 顯式；每 tick 至多一次（10 Hz，專案值）"
    referenced_by:
      - docs/architecture/adr-0003-solid-capsule-query.md
      - docs/architecture/adr-0002-horizontal-only-interaction-validation.md
      - docs/architecture/adr-0001-pure-csharp-movement-solver.md
      - docs/architecture/adr-0006-netcode-session-lifecycle.md
    added: 2026-09-26
    revised: ""

