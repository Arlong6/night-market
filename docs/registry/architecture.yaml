  - purpose: session_network_handler
    status: active
    api: "NGO 啟停的唯一擁有者是轉接層的 SessionNetworkHandler : Unity.Services.Multiplayer.INetworkHandler，由 SessionServices 唯一的 options 工廠以 WithNetworkHandler 掛在建房、加入、復原的 options 上（不經 ADR-0005；Host 與 client 共用，一個 session 一個實例）。初始化路徑上 handler 讀不到 session（RegisterSession 在模組初始化之後），所以轉接層在 H7 斷言通過後才 Bind(session)。契約：H1 client 啟網前主動收掉沙盒、斷言 UnityTransport，已 Bind 時前後兩次比對 _session_network（未 Bind 時略過，不得把讀不到當成缺席而 throw）；H2 approval 拒絕（JoinRejectReason，或 connected 前的 NGO 通用字串＝StaleBuild）記為 Rejected 並正常返回、永不 throw；H3 真故障才 throw SessionException；H4 Host 先等 NGO 完全停止、再一律 StartHost，false 即 throw，handler 成功後 MPS 寫屬性失敗時由轉接層 StopAsync 並撤回本機 _session_network；H5 StopAsync 冪等、永不 throw、永不懸掛、只停自己啟動的 NGO；H6 以 session 世代隔離；H7 建房與加入後斷言 session.Network.NetworkHandler == h，通過即 Bind（失敗且模組仍 Stopped 時以 setter 補掛）。Core 的 NetworkStarted／NetworkStopped／JoinRejected 只從 handler 觀察到的 NGO 狀態產生"
