    status: active
    owner_system: first-person-controller（owner 端寫；轉接層承載）
    adr: docs/architecture/adr-0003-solid-capsule-query.md
    interface: "玩家 NetworkObject 上的 NetworkVariable<ulong> PassThroughNpcMask（bit = NPC id）與 NetworkVariable<byte> PassThroughPlayerMask（bit = slot）；ReadPermission.Everyone；只在 PairMachine 轉移時以 .Value 賦值。這是 directed_pair_state 的複製編碼，不是第二個真相源"
    write_access: owner-only   # NetworkVariableWritePermission.Owner，必須在建構子指定（預設是 Server）
    referenced_by:
