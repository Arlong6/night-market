<!doctype html>
<!--
  PROTOTYPE - NOT FOR PRODUCTION
  Night Market Runner - Web feel prototype
  Question: auto-scroll vs player-paced? Jump/gravity tuning?
  Date: 2026-04-22
  Throwaway. Production will be rewritten in Godot.
-->
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Night Market Runner — Prototype</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0504;
    color: #f5edda;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #game {
    /* 320x180 native, scaled 4x via CSS + nearest-neighbor */
    width: 1280px;
    height: 720px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #1a0a00;
    outline: 1px solid #333;
  }
  #hint {
    margin-top: 12px;
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
  }
  kbd {
    background: #333;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="game" width="320" height="180"></canvas>
<div id="hint">
  <kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp;
  <kbd>Space</kbd> or <kbd>↑</kbd> jump &nbsp;·&nbsp;
  <kbd>↓</kbd> or <kbd>S</kbd> duck &nbsp;·&nbsp;
  <kbd>1</kbd> paced &nbsp;/&nbsp; <kbd>2</kbd> auto-scroll &nbsp;·&nbsp;
  <kbd>R</kbd> restart &nbsp;·&nbsp; click canvas to focus
</div>
<script>
'use strict';

// ---------- constants ----------
const VW = 320, VH = 180;          // native viewport
const LEVEL_W = 960;
const GROUND_Y = 160;

// Physics (matched to Godot prototype)
const MOVE_SPEED = 110;
const JUMP_VELOCITY = -250; // bumped from -230 after math showed marginal clearance
const GRAVITY = 800;
const JUMP_CUT_MULT = 0.5;
const COYOTE = 0.10;
const JUMP_BUFFER = 0.10;
const AUTO_SCROLL_SPEED = 80;

// Duck mechanic
const STAND_H = 40;
const DUCK_H = 20;

// Art-bible palette
const C_PLAYER     = '#E8F542';
const C_STRAW      = '#2A1A0A';
const C_COLLECT    = '#F2A227';
const C_HAZARD     = '#D94F2B';
const C_ENEMY      = '#7A3A2A';
const C_GROUND     = '#4A2010';
const C_PLATFORM   = '#8B1A1A';
const C_OBSTACLE   = '#555555';
const C_GOAL       = '#FFD966';
const C_BG_BACK    = '#1A0A00';
const C_BG_MID     = '#2F1506';
const C_BG_NEAR    = '#4A2010';
const C_UI_CREAM   = '#F5EDDA';
const C_UI_RED    = '#C2241A';
const C_UI_INK     = '#2A1A0A';

// ---------- canvas ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

// ---------- input ----------
const keys = {};
const justPressed = new Set();
window.addEventListener('keydown', (e) => {
  if (!keys[e.code]) justPressed.add(e.code);
  keys[e.code] = true;
  // Prevent browser arrow-scroll
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
}, { passive: false });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
cv.addEventListener('click', () => cv.focus());
cv.tabIndex = 0;
setTimeout(() => cv.focus(), 100);

function wasJustPressed(code) { return justPressed.has(code); }
function isDown(code) { return !!keys[code]; }
function jumpHeld() { return isDown('Space') || isDown('ArrowUp'); }
function jumpJustPressed() { return wasJustPressed('Space') || wasJustPressed('ArrowUp'); }
function leftDown() { return isDown('ArrowLeft'); }
function rightDown() { return isDown('ArrowRight'); }
function duckHeld() { return isDown('ArrowDown') || isDown('KeyS'); }

// ---------- level ----------
function makeLevel() {
  // static geometry: all { x, y, w, h } (position = top-left)
  const solids = [
    // Ground
    { x: 0, y: GROUND_Y, w: LEVEL_W, h: 40 },
    // Platforms
    { x: 180 - 24, y: 120 - 4, w: 48, h: 8 },
    { x: 360 - 24, y: 96 - 4,  w: 48, h: 8 },
    { x: 560 - 24, y: 128 - 4, w: 48, h: 8 },
    { x: 740 - 24, y: 104 - 4, w: 48, h: 8 },
    // Obstacles (24x24, top = 132) — scooters / crates, must JUMP over
    { x: 260 - 12, y: 144 - 12, w: 24, h: 24, hazardEdge: true },
    { x: 460 - 12, y: 144 - 12, w: 24, h: 24, hazardEdge: true },
    { x: 680 - 12, y: 144 - 12, w: 24, h: 24, hazardEdge: true },
    // Hanging signs — must DUCK under (forced low passage)
    { x: 320 - 20, y: 115, w: 40, h: 22, hanging: true },
    { x: 850 - 20, y: 115, w: 40, h: 22, hanging: true },
  ];
  const collectibles = [
    [120, 132], [220, 144], [330, 72], [430, 144],
    [560, 104], [640, 144], [800, 72], [880, 144],
  ].map(([x, y]) => ({ x: x - 10, y: y - 12, w: 20, h: 24, baseY: y - 12, alive: true, bob: 0 }));
  const enemies = [
    { x: 400 - 20, y: 148 - 12, w: 40, h: 24, originX: 400, dir: 1 },
    { x: 700 - 20, y: 148 - 12, w: 40, h: 24, originX: 700, dir: 1 },
  ];
  const goal = { x: LEVEL_W - 16, y: 120, w: 16, h: 40 };
  return { solids, collectibles, enemies, goal };
}

// ---------- state ----------
let state;
function resetState() {
  state = {
    player: {
      x: 24 - 12, y: 120 - 20, w: 24, h: STAND_H,
      vx: 0, vy: 0,
      onGround: false,
      coyoteTimer: 0,
      jumpBufferTimer: 0,
      ducking: false,
    },
    level: makeLevel(),
    score: 0,
    deaths: (state && state.deaths) || 0, // persist across restarts
    mode: (state && state.mode) || 'PACED', // persist across restarts
    autoScrollX: VW / 2,
    cameraX: VW / 2,
    deathFlashTimer: 0,
    goalFlashTimer: 0,
    sessionTime: 0,
  };
}
resetState();

// ---------- collision ----------
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function moveAndCollide(entity, dx, dy, solids) {
  // Horizontal
  entity.x += dx;
  for (const s of solids) {
    if (aabb(entity, s)) {
      if (dx > 0) entity.x = s.x - entity.w;
      else if (dx < 0) entity.x = s.x + s.w;
      entity.vx = 0;
    }
  }
  // Vertical
  entity.y += dy;
  let landed = false;
  for (const s of solids) {
    if (aabb(entity, s)) {
      if (dy > 0) {
        entity.y = s.y - entity.h;
        entity.vy = 0;
        landed = true;
      } else if (dy < 0) {
        entity.y = s.y + s.h;
        entity.vy = 0;
      }
    }
  }
  return landed;
}

// ---------- update ----------
function updatePlayer(dt) {
  const p = state.player;

  // Gravity
  if (!p.onGround) {
    p.vy += GRAVITY * dt;
    p.coyoteTimer -= dt;
  } else {
    p.coyoteTimer = COYOTE;
  }

  // Duck: only on ground. Shrink from top (keep feet), grow back if clearance above.
  const wantsDuck = duckHeld() && p.onGround;
  if (wantsDuck && !p.ducking) {
    p.y += (STAND_H - DUCK_H);
    p.h = DUCK_H;
    p.ducking = true;
  } else if (!wantsDuck && p.ducking) {
    // Try to stand — temporarily expand and test for collision
    const savedY = p.y;
    p.y -= (STAND_H - DUCK_H);
    p.h = STAND_H;
    let collides = false;
    for (const s of state.level.solids) { if (aabb(p, s)) { collides = true; break; } }
    if (collides) {
      // Still something above — stay ducked
      p.y = savedY;
      p.h = DUCK_H;
    } else {
      p.ducking = false;
    }
  }

  // Horizontal intent (ducking slows by 40% for slide-under feel)
  let intentX = 0;
  if (leftDown()) intentX -= 1;
  if (rightDown()) intentX += 1;
  p.vx = intentX * MOVE_SPEED * (p.ducking ? 0.6 : 1.0);

  // Jump buffer (can't jump while ducking)
  if (jumpJustPressed() && !p.ducking) p.jumpBufferTimer = JUMP_BUFFER;
  else p.jumpBufferTimer -= dt;

  if (p.jumpBufferTimer > 0 && p.coyoteTimer > 0 && !p.ducking) {
    p.vy = JUMP_VELOCITY;
    p.jumpBufferTimer = 0;
    p.coyoteTimer = 0;
  }

  // Jump-cut
  if (p.vy < 0 && !jumpHeld()) p.vy *= JUMP_CUT_MULT;

  // Integrate + collide
  p.onGround = false;
  const landed = moveAndCollide(p, p.vx * dt, p.vy * dt, state.level.solids);
  if (landed) p.onGround = true;

  // Clamp in bounds (can't walk off left edge of level)
  if (p.x < 0) { p.x = 0; p.vx = 0; }

  // Fell off world
  if (p.y > 240) {
    state.deaths++;
    resetState();
    state.deathFlashTimer = 0.1;
  }
}

function updateCollectibles(dt) {
  for (const c of state.level.collectibles) {
    if (!c.alive) continue;
    c.bob += dt;
    const up = Math.floor(c.bob * 4) % 2 === 0;
    c.y = c.baseY + (up ? -2 : 0);
    if (aabb(state.player, c)) {
      c.alive = false;
      state.score += 100;
    }
  }
}

function updateEnemies(dt) {
  for (const e of state.level.enemies) {
    e.x += 45 * e.dir * dt;
    const half = 40;
    if (e.x > e.originX + half - 20) { e.dir = -1; e.x = e.originX + half - 20; }
    else if (e.x < e.originX - half - 20) { e.dir = 1; e.x = e.originX - half - 20; }
    if (aabb(state.player, e)) {
      state.deaths++;
      resetState();
      state.deathFlashTimer = 0.1;
      return;
    }
  }
}

function updateCamera(dt) {
  if (state.mode === 'AUTO') {
    state.autoScrollX += AUTO_SCROLL_SPEED * dt;
    state.cameraX = Math.max(VW / 2, Math.min(LEVEL_W - VW / 2, state.autoScrollX));
    // Player fell behind auto-scroll
    const playerCenter = state.player.x + state.player.w / 2;
    if (playerCenter < state.cameraX - VW / 2 - 8) {
      state.deaths++;
      resetState();
      state.deathFlashTimer = 0.1;
    }
  } else {
    const playerCenter = state.player.x + state.player.w / 2;
    state.cameraX = Math.max(VW / 2, Math.min(LEVEL_W - VW / 2, playerCenter));
  }
}

function updateGoal() {
  if (aabb(state.player, state.level.goal)) {
    state.score += 500;
    state.goalFlashTimer = 0.3;
    resetState();
    state.goalFlashTimer = 0.3; // keep flash after reset
  }
}

function handleInput() {
  if (wasJustPressed('Digit1')) state.mode = 'PACED';
  if (wasJustPressed('Digit2')) {
    state.mode = 'AUTO';
    state.autoScrollX = Math.max(state.autoScrollX, state.cameraX);
  }
  if (wasJustPressed('KeyR')) resetState();
}

// ---------- render ----------
function px(v) { return Math.round(v); }

function drawBackground(camX) {
  // Parallax layers with Section 2 speed ratios (far 0.15, mid 0.4, near 1.0)
  ctx.fillStyle = C_BG_BACK;
  ctx.fillRect(0, 0, VW, VH);

  // Far-layer signage (desaturated verticals, scrolls at 0.15x)
  const farOffset = -camX * 0.15;
  ctx.fillStyle = '#1E0F04';
  for (let i = 0; i < 30; i++) {
    const x = px((i * 24 + farOffset) % (VW + 24)) - 24;
    ctx.fillRect(x, 20, 2, 60);
    ctx.fillRect(x + 12, 40, 2, 50);
  }

  // Mid-layer awnings (0.4x)
  const midOffset = -camX * 0.4;
  ctx.fillStyle = C_BG_MID;
  for (let i = 0; i < 20; i++) {
    const x = px((i * 48 + midOffset) % (VW + 48)) - 48;
    ctx.fillRect(x, 90, 40, 20);
  }
  // Lantern accents on mid layer (warm dots)
  ctx.fillStyle = '#D4920A';
  for (let i = 0; i < 20; i++) {
    const x = px((i * 48 + midOffset) % (VW + 48)) - 48;
    ctx.fillRect(x + 18, 110, 4, 4);
  }
}

function drawSolid(s, camX) {
  const sx = px(s.x - camX + VW / 2);
  const sy = px(s.y);

  if (s.hanging) {
    // Hanging sign — body + rope from awning + hazard edge on bottom (head-bump side)
    ctx.fillStyle = '#D4920A';  // old-gold lantern color
    ctx.fillRect(sx, sy, s.w, s.h);
    ctx.fillStyle = C_UI_INK;
    // Two ropes
    ctx.fillRect(sx + 4, 0, 1, sy);
    ctx.fillRect(sx + s.w - 5, 0, 1, sy);
    // Hazard tint on bottom edge (where you'd hit your head)
    ctx.fillStyle = C_HAZARD;
    ctx.fillRect(sx - 1, sy + s.h, s.w + 2, 2);
    return;
  }

  if (s.hazardEdge) {
    ctx.fillStyle = C_OBSTACLE;
    ctx.fillRect(sx, sy, s.w, s.h);
    ctx.fillStyle = C_HAZARD;
    ctx.fillRect(sx - 1, sy - 2, s.w + 2, 2);
    return;
  }

  // Ground vs platform detection
  ctx.fillStyle = (s.h >= 40) ? C_GROUND : C_PLATFORM;
  ctx.fillRect(sx, sy, s.w, s.h);
}

function drawCollectible(c, camX) {
  if (!c.alive) return;
  const sx = px(c.x - camX + VW / 2);
  const sy = px(c.y);
  ctx.fillStyle = C_COLLECT;
  ctx.fillRect(sx, sy, c.w, c.h);
  // Container spike
  ctx.fillStyle = C_STRAW;
  ctx.fillRect(sx + 9, sy - 4, 2, 4);
}

function drawEnemy(e, camX) {
  const sx = px(e.x - camX + VW / 2);
  const sy = px(e.y);
  ctx.fillStyle = C_ENEMY;
  ctx.fillRect(sx, sy, e.w, e.h);
  ctx.fillStyle = C_HAZARD;
  ctx.fillRect(sx - 1, sy - 2, e.w + 2, 2);
}

function drawPlayer(p, camX) {
  const sx = px(p.x - camX + VW / 2);
  const sy = px(p.y);
  ctx.fillStyle = C_PLAYER;
  ctx.fillRect(sx, sy, p.w, p.h);
  // Boba straw spike — shrinks when ducking (visual feedback for state)
  ctx.fillStyle = C_STRAW;
  const strawH = p.ducking ? 3 : 6;
  ctx.fillRect(sx + 18, sy - strawH, 2, strawH);
}

function drawGoal(g, camX) {
  const sx = px(g.x - camX + VW / 2);
  const sy = px(g.y);
  ctx.fillStyle = C_GOAL;
  ctx.fillRect(sx, sy, g.w, g.h);
}

function drawUI() {
  // Receipt strip
  ctx.fillStyle = C_UI_CREAM;
  ctx.fillRect(2, 2, 200, 32);
  ctx.fillStyle = C_UI_INK;
  ctx.fillRect(2, 34, 200, 1);

  ctx.fillStyle = C_UI_RED;
  ctx.font = 'bold 10px ui-monospace, monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(
    'SCORE ' + String(state.score).padStart(4, '0') +
    '  MODE ' + state.mode +
    '  DEATHS ' + state.deaths,
    6, 4
  );
  ctx.fillStyle = C_UI_INK;
  ctx.font = '8px ui-monospace, monospace';
  const p = state.player;
  const vy = p.vy.toFixed(0).padStart(5);
  const vx = p.vx.toFixed(0).padStart(5);
  const duckStr = p.ducking ? ' DUCK' : '';
  ctx.fillText(
    'VelY' + vy + ' VelX' + vx + duckStr + ' [1][2][R]',
    6, 18
  );
}

function drawDeathFlash() {
  if (state.deathFlashTimer > 0) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, VW, VH);
  } else if (state.goalFlashTimer > 0) {
    ctx.fillStyle = C_GOAL;
    ctx.globalAlpha = 0.4;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.fillStyle = C_BG_BACK;
  ctx.fillRect(0, 0, VW, VH);
  drawBackground(state.cameraX);

  for (const s of state.level.solids) drawSolid(s, state.cameraX);
  for (const c of state.level.collectibles) drawCollectible(c, state.cameraX);
  for (const e of state.level.enemies) drawEnemy(e, state.cameraX);
  drawGoal(state.level.goal, state.cameraX);
  drawPlayer(state.player, state.cameraX);

  drawDeathFlash();
  drawUI();
}

// ---------- main loop ----------
let lastTs = 0;
function tick(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.033) dt = 0.033; // cap for tab-switch spikes

  handleInput();
  updatePlayer(dt);
  updateCollectibles(dt);
  updateEnemies(dt);
  updateGoal();
  updateCamera(dt);

  if (state.deathFlashTimer > 0) state.deathFlashTimer -= dt;
  if (state.goalFlashTimer > 0) state.goalFlashTimer -= dt;
  state.sessionTime += dt;

  render();
  justPressed.clear();
  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
